name: Build, test and deploy Gromoze

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment while its migrations or restart are in progress.
concurrency:
  group: gromoze-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gromoze_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gromoze_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gromoze_ci -d gromoze_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gromoze_ci:ci-only-password@127.0.0.1:5432/gromoze_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: 'gromoze-ci:'
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up production Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build shared contracts
        run: npm run build --workspace=@truroot/shared
      - name: Generate database client and apply migrations to CI database
        run: |
          npx prisma generate --schema=apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - name: Subscription concurrency checks against CI PostgreSQL
        run: npm run test:ci --workspace=api -- src/billing/workspace.database.spec.ts
        env:
          RUN_SUBSCRIPTION_DATABASE_TESTS: '1'
          SUBSCRIPTION_DATABASE_URL: postgresql://gromoze_ci:ci-only-password@127.0.0.1:5432/gromoze_ci?schema=public
      - name: Compile API without incremental artifacts
        run: |
          npx tsc -p apps/api/tsconfig.build.json --incremental false
          test -f apps/api/dist/src/main.js
      - name: API authentication, tenancy, portal and upload regression tests
        run: >-
          npm run test:ci --workspace=api --
          src/auth/auth.controller.spec.ts
          src/auth/auth.service.spec.ts
          src/billing/workspace.spec.ts
          src/hr/hr.service.tenant-isolation.spec.ts
          src/common/tenant/tenant.guard.spec.ts
          src/common/tenant/tenant-access.service.spec.ts
          src/crm/portal-accounts.controller.spec.ts
          src/crm/email-connectors.service.spec.ts
          src/billing/trial-reminder.worker.spec.ts
          src/billing/razorpay.service.spec.ts
          src/common/utils/cipher.util.spec.ts
          src/organization/organization.service.trial.spec.ts
          src/organization/organization.service.domains.spec.ts
          src/organization/organization.service.tenant-isolation.spec.ts
          src/organization/organization.service.platform-management.spec.ts
          src/organization/organization.workspace-settings.spec.ts
          src/organization/tenant-admin-email.spec.ts
          src/uploads/uploads.service.spec.ts
          src/mobile-app/mobile-app-admin.guard.spec.ts
          src/access/access.constants.spec.ts
          src/access/access.service.tenant-isolation.spec.ts
          src/app.controller.spec.ts
      - name: Web sign-in, OTP, recovery and tenant branding regression tests
        run: >-
          npm run test:ci --workspace=web -- --runInBand --silent
          src/screens/billing/SubscriptionWorkspace.test.tsx
          src/common/queries/useWorkspaceAdministration.test.tsx
          src/screens/auth/login/login.test.tsx
          src/screens/auth/login-otp/LoginOtpScreen.test.tsx
          src/screens/auth/forgot-password/ForgotPasswordScreen.test.tsx
          src/screens/auth/reset-password/ResetPasswordScreen.test.tsx
          src/screens/admin/settings/LoginPagePreview.test.tsx
          src/screens/admin/settings/WorkspaceSettingsPage.preview.test.tsx
          src/screens/hr/settings/WorkspaceIntegrationSafety.test.tsx
          src/screens/superadmin/PlatformAuditLogsScreen.test.tsx
          src/screens/superadmin/TenantManagementDialog.test.tsx
          src/components/notifications/HeaderNotificationBell.test.tsx
          src/common/tenantRequestScope.test.ts
          src/common/tenantResolver.test.ts
          src/common/TenantHostBoundary.test.tsx
          src/common/displayReference.test.ts
          src/common/apiError.test.ts
          src/common/components/DataTableCells.test.tsx
          src/screens/admin/settings/MobileAppScreen.test.tsx
          src/screens/admin/dashboard/DashboardHeader.platform.test.tsx
          src/screens/admin/dashboard/DashboardSidebar.test.tsx
          src/common/navigation/navigationRegistry.test.ts
          src/common/access/access.test.ts
      - name: Build production web application
        run: npm run build --workspace=web
        env:
          NODE_ENV: production
          VITE_API_URL: /api

  deploy:
    name: Deploy crm.gromoze.com
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://crm.gromoze.com
    steps:
      - name: Deploy the validated commit using the restricted SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!value}" ]; then
              echo "Missing production environment secret: $value" >&2
              exit 1
            fi
          done
          ssh_dir="$RUNNER_TEMP/gromoze-ssh"
          install -d -m 700 "$ssh_dir"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public API and web application
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://crm.gromoze.com/api/health/ready
          curl --fail --silent --show-error --retry 3 --max-time 30 --output /dev/null https://crm.gromoze.com/login
          echo "Deployed commit $GITHUB_SHA to https://crm.gromoze.com" >> "$GITHUB_STEP_SUMMARY"
